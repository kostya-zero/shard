[package]
name = "shard"
description = "An MCP server for Obsidian."
authors = ["Konstantin Zhigaylo <kostyazero@proton.me>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/kostya-zero/shard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indexmap = "2.14.2"
rmcp = { version = "3.9.0", features = ["server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
